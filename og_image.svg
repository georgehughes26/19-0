<svg width="100%" viewBox="0 0 690 367" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>19-0 — Cricket Management and Simulation Game</title>
  <desc>Social share preview card for 19-0, a cricket management and simulation game covering T20 Blast, Test Cricket, and the World Cup.</desc>

  <rect width="690" height="367" fill="#0f0f13"/>

  <!-- Big 19-0 logo text -->
  <text x="345" y="175" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="130" font-weight="800" letter-spacing="-6" fill="url(#logoGrad)">19-0</text>

  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9c846"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Divider line -->
  <line x1="95" y1="205" x2="595" y2="205" stroke="#252535" stroke-width="0.5"/>

  <!-- Tagline -->
  <text x="345" y="233" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#9090a8" letter-spacing="2">
    CRICKET MANAGEMENT AND SIMULATION GAME
  </text>

  <!-- Mode pills -->
  <rect x="110" y="253" width="150" height="32" rx="16" fill="#16161f" stroke="#252535" stroke-width="0.5"/>
  <text x="185" y="274" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f9c846">T20 Blast</text>

  <rect x="270" y="253" width="150" height="32" rx="16" fill="#16161f" stroke="#252535" stroke-width="0.5"/>
  <text x="345" y="274" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f97316">Test Cricket</text>

  <rect x="430" y="253" width="150" height="32" rx="16" fill="#16161f" stroke="#252535" stroke-width="0.5"/>
  <text x="505" y="274" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e11d48">World Cup</text>

  <!-- URL -->
  <text x="345" y="320" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#404060" letter-spacing="1">
    www.19-0.co.uk
  </text>
</svg>
